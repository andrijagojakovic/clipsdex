[project]
name = "clipsdex"
version = "0.0.1"
description = "Local, private analysis and organization of your saved short videos."
readme = "README.md"
license = "MIT"
authors = [{ name = "Andrija Gojaković" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "platformdirs>=4.13.0",
    "pydantic>=2.14.1",
    "sqlmodel>=0.0.48",
    "typer>=0.27.3",
]

[project.scripts]
clipsdex = "clipsdex_engine.cli:app"

[project.urls]
Repository = "https://github.com/andrijagojakovic/clipsdex"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipsdex_engine"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Generated by Alembic autogenerate; long lines are fine there.
"src/clipsdex_engine/db/migrations/versions/*" = ["E501", "W291"]
# Tests use Cyrillic paths on purpose (non-ASCII Windows usernames/folders, see CLAUDE.md §8).
"tests/*" = ["RUF001"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["tests"]  # test helper modules (e.g. tests/synthetic.py) imported by name
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = ["integration: needs Ollama, real media or network; skipped by default"]
