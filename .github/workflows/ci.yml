name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (lint, types, tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Install ffmpeg (media tests generate synthetic clips with it)
        # The Chocolatey community feed fails now and then (timeouts, rate limits): retry.
        run: |
          for ($i = 1; $i -le 3; $i++) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "choco install failed (try $i of 3), retrying in 30 s"
            Start-Sleep -Seconds 30
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ffmpeg -version

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest
